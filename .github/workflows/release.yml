name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit   # CI needs GSUITE_CLIENT_JSON to build the wheel

  # The installers in the README point at releases/latest, which moves only when this succeeds.
  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches version
        run: test "v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"
      # Publish exactly the wheel and installers the fresh-install jobs just tested.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: tested
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tested/dist/*.whl tested/install.sh tested/install.ps1 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
