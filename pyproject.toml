[project]
name = "workspace-cli"
version = "1.1.0"
description = "Google Sheets and Docs from the terminal, for people and AI agents (gsuite)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Exact pins: this is an application, and every teammate must get the same thing.
# The installers also pass --exclude-newer, which freezes the dependencies of these.
dependencies = [
    "google-api-python-client==2.202.0",
    "google-auth==2.62.2",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "gspread==6.2.1",
    "gspread-dataframe==4.0.0",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "requests==2.34.2",
]

[project.scripts]
gsuite = "workspace_cli.cli:main"
gpy = "workspace_cli.gpy:main"

[project.urls]
Homepage = "https://github.com/kathanshah/workspace-cli"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_cli", "src/gworkspace"]
# Git-ignored on purpose (see .gitignore) but must be in the wheel.
artifacts = ["src/workspace_cli/client.json"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Same snapshot date as EXCLUDE_NEWER in the installers.
exclude-newer = "2026-11-20T00:00:00Z"
# Staff machines: every dependency must have a ready-built wheel for each of these (no compiling).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'win32' and platform_machine == 'ARM64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
no-build-package = ["cryptography", "pandas", "numpy", "cffi"]
